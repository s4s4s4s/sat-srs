name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Тесты ДО сборки, а не рядом с ней.
      #
      # Приложение выкатывалось на телефон без единого прогона: в репозитории
      # лежат симуляция сессии и проверки метрик, но их не запускало ничего, и
      # сломанный планировщик доехал бы до карточек молча. Красный тест здесь
      # останавливает выкатку — на телефоне остаётся прошлая рабочая версия,
      # что заведомо лучше свежей сломанной.
      - run: npm test

      - run: npm run icons
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
